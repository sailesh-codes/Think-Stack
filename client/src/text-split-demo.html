<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Enhanced Text Split Animation Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 2rem;
        }
        .text-split-main {
            display: block;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .description {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-bottom: 3rem;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        .btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        span {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="hero-title">
            <span class="text-split-main">Generate AI Quizzes</span>
        </h1>
        
        <p class="description">
            Enter any topic, select difficulty, and let our AI create perfect quizzes instantly. 
            Start with 5 free generations - no credit card required.
        </p>
        
        <a href="#" class="button">Start Free →</a>
    </div>

    <div class="controls">
        <button class="btn" onclick="playDramaticAnimation()">Dramatic Effect</button>
        <button class="btn" onclick="playWaveAnimation()">Wave Effect</button>
        <button class="btn" onclick="playSpiralAnimation()">Spiral Effect</button>
        <button class="btn" onclick="resetAnimation()">Reset</button>
    </div>

    <script>
        let chars;

        function initializeTextSplits() {
            const mainElement = document.querySelector('.text-split-main');
            if (mainElement) {
                chars = mainElement.textContent.split('').map((char, index) => {
                    const span = document.createElement('span');
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.display = 'inline-block';
                    span.style.opacity = '0';
                    span.style.transform = 'translateY(100px) rotate(180deg) scale(0)';
                    return span;
                });
                
                mainElement.innerHTML = '';
                chars.forEach(span => mainElement.appendChild(span));
            }
        }

        // Dramatic random animation
        function playDramaticAnimation() {
            resetAnimation();
            
            gsap.to(chars, {
                opacity: 1,
                y: 0,
                rotation: 0,
                scale: 1,
                duration: 0.8,
                stagger: {
                    each: 0.05,
                    from: "random",
                    ease: "power2.inOut"
                },
                ease: "back.out(1.7)"
            });
        }

        // Wave animation
        function playWaveAnimation() {
            resetAnimation();
            
            gsap.to(chars, {
                opacity: 1,
                y: 0,
                rotation: 0,
                scale: 1,
                duration: 0.6,
                stagger: {
                    each: 0.03,
                    from: "start",
                    ease: "power2.inOut"
                },
                ease: "power2.out"
            });
        }

        // Spiral animation
        function playSpiralAnimation() {
            resetAnimation();
            
            chars.forEach((char, index) => {
                gsap.to(char, {
                    opacity: 1,
                    y: 0,
                    rotation: 0,
                    scale: 1,
                    duration: 1,
                    delay: index * 0.1,
                    ease: "back.out(1.7)"
                });
            });
        }

        // Reset animation
        function resetAnimation() {
            gsap.set(chars, {
                opacity: 0,
                y: 100,
                rotation: 180,
                scale: 0
            });
        }

        // Auto-play on load
        window.addEventListener('load', () => {
            initializeTextSplits();
            setTimeout(playDramaticAnimation, 500);
        });
    </script>
</body>
</html>
